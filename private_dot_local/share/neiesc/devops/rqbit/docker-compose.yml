services:
  rqbit:
    image: ikatson/rqbit:v7.0.0-beta.3
    network_mode: host
    ports:
      - 3030:3030
      - 4240:4240
    environment:
      RQBIT_UPNP_SERVER_ENABLE: "true"
      RQBIT_UPNP_SERVER_FRIENDLY_NAME: rqbit-docker
    volumes:
      - db:/home/rqbit/db
      - cache:/home/rqbit/cache
      - ${HOME}/Downloads:/home/rqbit/downloads
    restart: 'unless-stopped'

volumes:
  db: {}
  cache: {}
